
name: Daily Podcast

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1-5"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Install FFmpeg
        run: |
          curl -fL --retry 3 \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            -o /tmp/ffmpeg.tar.xz
          mkdir -p /tmp/ffmpeg-static
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static
          FFMPEG_PATH=$(find /tmp/ffmpeg-static -type f -name ffmpeg | head -n 1)
          test -n "$FFMPEG_PATH"
          sudo cp "$FFMPEG_PATH" /usr/local/bin/ffmpeg
          sudo chmod +x /usr/local/bin/ffmpeg
          ffmpeg -version

      - name: Generate podcast
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PODCAST_BASE_URL: ${{ vars.PODCAST_BASE_URL }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python build.py

      - name: Publish files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Publish daily podcast"
          git push
